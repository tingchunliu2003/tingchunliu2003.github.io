# --- Theme ---------------------------------------------------------------
remote_theme: "mmistakes/minimal-mistakes@4.27.1"
minimal_mistakes_skin: "dark" # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# --- Site ----------------------------------------------------------------
locale: "en-US"
title: "Ting-Chun (Ting) Liu"
name: "Ting-Chun (Ting) Liu"
description: "Master's student in Biomedical Engineering at Johns Hopkins University."
url: "https://tingchunliu2003.github.io"
baseurl: ""
repository: "tingchunliu2003/tingchunliu2003.github.io"
search: true

# --- Build -------------------------------------------------------------
markdown: kramdown
timezone: America/New_York

include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

# --- Collections -----------------------------------------------------
collections:
  techposts:
    output: true
    permalink: /:collection/:path/
  miscellaneous:
    output: true
    permalink: /:collection/:path/

# --- Author sidebar --------------------------------------------------
author:
  name: "Ting-Chun (Ting) Liu"
  bio: "Biomedical Engineering M.S. @ Johns Hopkins University"
  location: "Baltimore, MD"
  avatar: "/assets/images/selfie.png"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/davidliu012"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:tingchun.academic@gmail.com"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/davidliu012"

# --- Front-matter defaults ----------------------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: techposts
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: miscellaneous
    values:
      layout: single
      author_profile: true
